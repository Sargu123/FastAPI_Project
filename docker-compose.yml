
version: "3.9"

services:

  postgres_container:
    image: postgres:15

    container_name: postgres_container

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: Seed

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    

  fastapi_container:
    build: .

    container_name: fastapi_container

    restart: always

    depends_on:
      - postgres_container

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload

volumes:
  postgres_data: